<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Let's Build Something Great">
  <defs>
    <linearGradient id="fBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709" />
      <stop offset="50%" stop-color="#0C0C0F" />
      <stop offset="100%" stop-color="#111114" />
    </linearGradient>
    <radialGradient id="fRedGlow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.16" />
      <stop offset="65%" stop-color="#EF4444" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fRedLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0" />
      <stop offset="30%" stop-color="#DC2626" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#EF4444" stop-opacity="1" />
      <stop offset="70%" stop-color="#DC2626" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Base Dark Banner -->
  <rect x="1" y="1" width="1198" height="118" rx="14" fill="url(#fBgGrad)" stroke="#1F1F23" stroke-width="1.5" />
  <rect x="2" y="2" width="1196" height="116" rx="13" fill="url(#fRedGlow)" />

  <!-- Top & Bottom Subtle Red Lines -->
  <rect x="320" y="1" width="560" height="1.5" fill="url(#fRedLine)" opacity="0.6" />
  <rect x="200" y="116.5" width="800" height="2.5" fill="url(#fRedLine)" />

  <!-- Corner Decorative Brackets -->
  <path d="M 24 36 L 24 20 L 40 20" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M 1160 20 L 1176 20 L 1176 36" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M 24 84 L 24 100 L 40 100" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M 1160 100 L 1176 100 L 1176 84" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- Minimal Side Accents -->
  <line x1="355" y1="60" x2="405" y2="60" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <circle cx="343" cy="60" r="2.2" fill="#DC2626" opacity="0.75" />
  <line x1="795" y1="60" x2="845" y2="60" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <circle cx="857" cy="60" r="2.2" fill="#DC2626" opacity="0.75" />

  <!-- Footer Text -->
  <text x="600" y="68" text-anchor="middle" fill="#F9FAFB"
        font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
        font-size="24" font-weight="600" letter-spacing="1.5">
    Let&#8217;s Build Something Great
  </text>
</svg>
